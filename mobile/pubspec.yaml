name: workshop_peserta
description: "Aplikasi Mobile Peserta SIM Workshop Universitas Andalas"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # JSON Serialization
  json_annotation: ^4.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Screenshot evidence for online attendance (web and mobile)
  file_selector: ^1.1.0

  # Presensi offline: pindai QR panitia & lokasi GPS (geofence)
  mobile_scanner: ^7.0.0
  geolocator: ^14.0.0

  # Unduh & buka sertifikat PDF
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/unand-logo.png
  fonts:
    # Sama dengan portal web peserta (Plus Jakarta Sans, lisensi OFL)
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

